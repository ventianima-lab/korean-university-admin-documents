interface:
  display_name: "Complete Document Authoring"
  short_description: "Complete forms and verify authorized red choices."
  default_prompt: "Use $submission-ready-authoring with the format-preservation skill for every institutional form: retain the complete per-business source pack before writing, inspect all instruction payloads/anchors, preserve official structure and latest user content, and reconcile guidance, attachments and exact saved layout before completion. Find the current responsible-office official blank/manual/notice attachments first and bind exact identity/version/role before using old filled records as content/calculation/wording precedent only. On initial writing and every follow-up, reuse or create a clearly named visible official-forms folder within the actual current working packet, retaining unfilled originals, guidance and annotations; TEMP, hidden or distant parent/central copies alone do not qualify. Pass that working packet as --active-dir and its official-forms subfolder as --source-dir; require source_dir_checked: true. Preserve live user edits; only an explicit current-task structural override changes form authority. Before choosing candidate values, independently classify each field/row and source wording; new filled HWPX check invocations require require_field_semantics: true, with field-specific placement evidence and explicit scoped authority to change operational phrases. A legacy false/omitted-flag PASS is not semantic clearance. Before evidence placement, carry the latest receipt dispositions and reserved physical-mount blanks into the role/slot map, inspect true upright orientation beyond EXIF, and verify every inserted image and empty slot in the exact saved artifact. For surveys, resolve collection date versus single/combined target coverage and unique respondents before aggregation; verify saved scope labels, denominators and output grouping."
