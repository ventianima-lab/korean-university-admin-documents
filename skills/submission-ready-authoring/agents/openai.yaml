interface:
  display_name: "Complete Document Authoring"
  short_description: "Complete forms and verify authorized red choices."
  default_prompt: "Use $submission-ready-authoring with the format-preservation skill for every institutional form: retain the complete per-business source pack before writing, inspect all instruction payloads/anchors, preserve official structure and latest user content, and reconcile guidance, attachments and exact saved layout before completion. Before choosing candidate values, independently classify each field/row and source wording; new filled HWPX check invocations require require_field_semantics: true, with field-specific placement evidence and explicit scoped authority to change operational phrases. A legacy false/omitted-flag PASS is not semantic clearance. Before evidence placement, carry the latest receipt dispositions and reserved physical-mount blanks into the role/slot map, inspect true upright orientation beyond EXIF, and verify every inserted image and empty slot in the exact saved artifact. For surveys, resolve collection date versus single/combined target coverage and unique respondents before aggregation; verify saved scope labels, denominators and output grouping."
