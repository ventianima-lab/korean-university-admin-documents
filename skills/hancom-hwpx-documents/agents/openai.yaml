interface:
  display_name: "Hancom HWPX Documents"
  short_description: "Create and repair print-ready HWPX forms."
  default_prompt: "Use $hancom-hwpx-documents to create or revise HWPX: before writing, pass the active source-pack --guidance-check against the annotated official original, inspect actual guidance payloads/anchors, preserve official structure and latest user content, and reconcile every instruction/attachment and the exact saved structure/layout. Before choosing candidate values, independently classify each field/row and source wording; new filled HWPX check invocations require require_field_semantics: true, with field-specific placement evidence and explicit scoped authority to change operational phrases. A legacy false/omitted-flag PASS is not semantic clearance. Before evidence placement, carry the latest receipt dispositions and reserved physical-mount blanks into the role/slot map, inspect true upright orientation beyond EXIF, and verify every inserted image and empty slot in the exact saved artifact. For surveys, resolve collection date versus single/combined target coverage and unique respondents before aggregation; verify saved scope labels, denominators and output grouping."

